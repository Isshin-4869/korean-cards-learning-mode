<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>表紙と学習の始め方</title>
<style>
  /* ---- 見比べ用ページ ---- */
  html { font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Apple SD Gothic Neo", sans-serif; }
  body { margin: 0; background: #E4E3E0; color: #1B1C1E; }
  .tools { position: sticky; top: 0; z-index: 10; background: #E4E3E0; padding: 12px 16px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .tools button { font: inherit; font-size: 0.9375rem; min-height: 44px; min-width: 44px; padding: 0 14px; border: 0; border-radius: 10px; background: #D3D2CE; cursor: pointer; }
  .tools button[aria-pressed="true"] { background: #1B1C1E; color: #fff; }
  .tools .lbl { font-size: 0.8125rem; color: #55565A; margin-left: 8px; }
  .desc { max-width: 1100px; padding: 0 16px 8px; font-size: 0.9375rem; line-height: 1.6; }
  .desc h2 { font-size: 1.125rem; margin: 4px 0; }
  .desc ul { margin: 4px 0; padding-left: 1.2em; }
  .stage { display: flex; flex-wrap: wrap; gap: 24px; padding: 8px 16px 48px; align-items: flex-start; }
  .cap { font-size: 0.8125rem; color: #55565A; margin: 0 0 6px 4px; }

  /* ---- アプリ画面 ---- */
  .screen { position: relative; width: 390px; max-width: 100%; height: 844px; overflow: hidden; border-radius: 36px; background: var(--bg); color: var(--fg); display: flex; flex-direction: column; font-size: 1.0625rem; line-height: 1.5; }
  .status { height: 47px; flex: none; display: flex; align-items: flex-end; justify-content: space-between; padding: 0 28px 6px; font-size: 0.9375rem; font-weight: 600; }
  .homebar { height: 34px; flex: none; display: flex; align-items: flex-end; justify-content: center; padding-bottom: 8px; position: relative; z-index: 3; }
  .homebar::after { content: ""; width: 134px; height: 5px; border-radius: 3px; background: var(--fg); opacity: .9; }
  .pad { padding: 0 16px; }
  .scroll { flex: 1; overflow: auto; }
  .muted { color: var(--fg2); }
  .small { font-size: 0.8125rem; }
  .tiny { font-size: 0.75rem; }
  .row { display: flex; align-items: center; gap: 12px; }
  .grow { flex: 1; min-width: 0; }
  .btn { font: inherit; border: 0; min-height: 48px; border-radius: 14px; background: var(--fill); color: var(--fg); padding: 0 12px; }
  .btn.primary { background: var(--accent); color: var(--on-accent); font-weight: 600; min-height: 56px; width: 100%; }
  .btn.danger { background: var(--ng); color: #fff; font-weight: 600; min-height: 52px; width: 100%; }
  .btn.text { background: none; color: var(--accent-text); }
  .acc { color: var(--accent-text); }
  .modes { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 8px; }
  .modes .btn { font-size: 0.875rem; padding: 0 4px; }
  .bar { height: 6px; border-radius: 3px; background: var(--fill); display: flex; overflow: hidden; }
  .bar > .m { background: var(--accent); } .bar > .l { background: var(--accent-weak); }
  .big { font-size: 1.75rem; font-weight: 700; line-height: 1.15; }
  .card { background: var(--surface); border-radius: 16px; padding: 14px 16px; }
  .segbtn { display: flex; gap: 6px; } .segbtn span { flex: 1; min-height: 40px; border-radius: 10px; background: var(--fill); display: flex; align-items: center; justify-content: center; font-size: 0.875rem; }
  .segbtn span.on { background: var(--sel-bg); color: var(--sel-fg); font-weight: 600; }
  .week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; text-align: center; }
  .week .d { height: 32px; border-radius: 8px; background: var(--fill); display: flex; align-items: center; justify-content: center; font-size: 0.75rem; color: var(--fg2); }
  .week .d.on { background: var(--accent); color: var(--on-accent); font-weight: 700; }
  .week .d.today { background: var(--sel-bg-soft); color: var(--accent-text); font-weight: 700; }
  /* 下から出る確認シート（本当に浮いているので影を付ける） */
  .scrim { position: absolute; inset: 0; background: rgba(0, 0, 0, 0.35); z-index: 2; }
  .sheet { position: absolute; left: 0; right: 0; bottom: 0; z-index: 2; background: var(--surface); border-radius: 20px 20px 0 0; padding: 20px 16px 0; box-shadow: 0 -6px 24px rgba(0, 0, 0, 0.18); }
</style>
</head>
<body>
<div class="tools" role="toolbar">
  <span class="lbl">忘却曲線：</span>
  <button data-opt="1">案1</button><button data-opt="2">案2</button><button data-opt="3">案3</button><button data-opt="4">案4</button><button data-opt="5">案5</button>
  <span class="lbl">色：</span>
  <button data-pal="1">青</button><button data-pal="2">白黒</button><button data-pal="3">iOS</button><button data-pal="4">青磁</button><button data-pal="5">藍</button>
  <span class="lbl">テーマ：</span>
  <button data-theme="light">ライト</button><button data-theme="dark">ダーク</button>
</div>
<div class="desc" id="desc"></div>
<div class="stage" id="stage"></div>

<script>
// ---- データ（課ごとの枚数は実数。習得率・連続日数・記憶の予測はダミー） ----
const LESSONS = [['第1課', 9, 100, 0], ['第2課', 26, 88, 8], ['第3課', 19, 74, 16], ['第4課', 35, 51, 23], ['第5課', 51, 22, 30], ['第6課', 87, 6, 14], ['第7課', 107, 0, 4], ['第8課', 100, 0, 0], ['第9課', 153, 0, 0], ['第10課', 165, 0, 0], ['第11課', 123, 0, 0], ['第12課', 121, 0, 0], ['第13課', 96, 0, 0], ['第14課', 105, 0, 0], ['第15課', 121, 0, 0], ['第16課', 115, 0, 0], ['第17課', 102, 0, 0], ['第18課', 114, 0, 0], ['第19課', 95, 0, 0], ['第20課', 85, 0, 0], ['第21課', 126, 0, 0], ['第22課', 77, 0, 0], ['会話表現', 82, 10, 5]];
const SEL = new Set(['第1課', '第2課', '第3課', '第4課', '第5課']);
const RANGE = { label: '第1〜5課', count: 140, m: 54, l: 22, mc: 76, lc: 31, uc: 33 };
const STREAK = { days: 12, best: 18, week: [1, 1, 1, 1, 1, 0, 0], todayIdx: 5 };
const WEEKDAYS = ['月', '火', '水', '木', '金', '土', '日'];
// 記憶の予測（学習した 107 枚の平均）。今日から 7 日後まで
const RECALL = [86, 78, 71, 66, 61, 57, 54, 51];
const RECALL_IF_REVIEW = [95, 92, 89, 87, 85, 83, 81, 80];
const DUE = [12, 9, 14, 6, 11, 8, 5, 7]; // その日に「忘れかけ」になる枚数（今日〜7日後）
const DAYS = ['今日', '明日', '2日後', '3日後', '4日後', '5日後', '6日後', '7日後'];
const BUCKETS = [['しっかり', 48], ['あやうい', 37], ['忘れかけ', 22]];
const short = (n) => (n === '会話表現' ? '会話' : n.replace('第', '').replace('課', ''));

const PAL = {
  1: { light: { bg: '#F4F3EF', fg: '#1C1D1F', fg2: '#66676B', sep: '#DAD8D2', fill: '#E7E5E0', accent: '#2F57C9', 'accent-text': '#2F57C9', 'accent-weak': 'rgba(47,87,201,.35)', 'on-accent': '#fff', 'sel-bg': '#2F57C9', 'sel-fg': '#fff', 'sel-bg-soft': 'rgba(47,87,201,.14)', surface: '#FFFFFF', ng: '#B8322F' },
       dark: { bg: '#161719', fg: '#ECECEE', fg2: '#9C9DA2', sep: '#2E2F33', fill: '#25262A', accent: '#87A2FF', 'accent-text': '#87A2FF', 'accent-weak': 'rgba(135,162,255,.35)', 'on-accent': '#0F1630', 'sel-bg': '#87A2FF', 'sel-fg': '#0F1630', 'sel-bg-soft': 'rgba(135,162,255,.16)', surface: '#1F2023', ng: '#E5534B' } },
  2: { light: { bg: '#FFFFFF', fg: '#111111', fg2: '#6E6E6E', sep: '#E6E6E6', fill: '#F1F1F1', accent: '#111111', 'accent-text': '#111111', 'accent-weak': 'rgba(17,17,17,.28)', 'on-accent': '#FFFFFF', 'sel-bg': '#111111', 'sel-fg': '#FFFFFF', 'sel-bg-soft': 'rgba(17,17,17,.08)', surface: '#F7F7F7', ng: '#B3261E' },
       dark: { bg: '#0E0E0E', fg: '#EDEDED', fg2: '#9A9A9A', sep: '#262626', fill: '#1C1C1C', accent: '#EDEDED', 'accent-text': '#EDEDED', 'accent-weak': 'rgba(237,237,237,.3)', 'on-accent': '#0E0E0E', 'sel-bg': '#EDEDED', 'sel-fg': '#0E0E0E', 'sel-bg-soft': 'rgba(237,237,237,.12)', surface: '#161616', ng: '#E5534B' } },
  3: { light: { bg: '#F2F2F7', fg: '#000000', fg2: '#6C6C70', sep: '#E5E5EA', fill: '#E5E5EA', accent: '#007AFF', 'accent-text': '#007AFF', 'accent-weak': 'rgba(0,122,255,.3)', 'on-accent': '#FFFFFF', 'sel-bg': '#007AFF', 'sel-fg': '#FFFFFF', 'sel-bg-soft': 'rgba(0,122,255,.12)', surface: '#FFFFFF', ng: '#D70015' },
       dark: { bg: '#000000', fg: '#FFFFFF', fg2: '#98989F', sep: '#38383A', fill: '#2C2C2E', accent: '#0A84FF', 'accent-text': '#0A84FF', 'accent-weak': 'rgba(10,132,255,.35)', 'on-accent': '#FFFFFF', 'sel-bg': '#0A84FF', 'sel-fg': '#FFFFFF', 'sel-bg-soft': 'rgba(10,132,255,.2)', surface: '#1C1C1E', ng: '#FF453A' } },
  4: { light: { bg: '#F6F4EE', fg: '#1E2422', fg2: '#68706C', sep: '#DEDBD2', fill: '#EAE7DF', accent: '#2E7663', 'accent-text': '#2E7663', 'accent-weak': 'rgba(46,118,99,.3)', 'on-accent': '#FFFFFF', 'sel-bg': '#D5E6DF', 'sel-fg': '#1F5A4A', 'sel-bg-soft': 'rgba(46,118,99,.12)', surface: '#FFFFFF', ng: '#B3392F' },
       dark: { bg: '#131715', fg: '#E5EAE7', fg2: '#939C97', sep: '#262C29', fill: '#1F2522', accent: '#6CC3AE', 'accent-text': '#6CC3AE', 'accent-weak': 'rgba(108,195,174,.3)', 'on-accent': '#0B1A16', 'sel-bg': '#1E3A33', 'sel-fg': '#8ED6C4', 'sel-bg-soft': 'rgba(108,195,174,.14)', surface: '#1A1F1D', ng: '#E5675D' } },
  5: { light: { bg: '#F5F5F3', fg: '#1A1B1F', fg2: '#6A6B72', sep: '#E1E1DD', fill: '#E9E9E6', accent: '#3F4BA8', 'accent-text': '#3F4BA8', 'accent-weak': 'rgba(63,75,168,.3)', 'on-accent': '#FFFFFF', 'sel-bg': '#3F4BA8', 'sel-fg': '#FFFFFF', 'sel-bg-soft': 'rgba(63,75,168,.12)', surface: '#FFFFFF', ng: '#B8322F' },
       dark: { bg: '#121317', fg: '#E8E9EE', fg2: '#9798A2', sep: '#25262D', fill: '#1E1F26', accent: '#8F9AF0', 'accent-text': '#8F9AF0', 'accent-weak': 'rgba(143,154,240,.3)', 'on-accent': '#10132E', 'sel-bg': '#8F9AF0', 'sel-fg': '#10132E', 'sel-bg-soft': 'rgba(143,154,240,.16)', surface: '#1A1B21', ng: '#E5534B' } },
};

// ---- 部品 ----
const status = () => '<div class="status"><span>9:41</span><span>●●● ▮</span></div>';
const screen = (inner) => `<div class="screen">${status()}${inner}<div class="homebar"></div></div>`;
const bar = (m, l) => `<div class="bar"><div class="m" style="width:${m}%"></div><div class="l" style="width:${l}%"></div></div>`;
const week = () => `<div class="week">${WEEKDAYS.map((w, i) => `<div><div class="tiny muted">${w}</div><div class="d ${STREAK.week[i] ? 'on' : i === STREAK.todayIdx ? 'today' : ''}" style="margin-top:2px">${STREAK.week[i] ? '✓' : i === STREAK.todayIdx ? '今日' : ''}</div></div>`).join('')}</div>`;
const streakCard = () => `<div class="card"><div style="font-size:2.75rem;font-weight:800;line-height:1" class="acc">${STREAK.days}<span style="font-size:1.125rem;font-weight:700"> 日連続</span></div><div class="small muted" style="margin-top:6px">今日やれば ${STREAK.days + 1} 日。最高記録 ${STREAK.best} 日</div><div style="margin-top:12px">${week()}</div></div>`;
const progressLine = () => `<div class="row" style="align-items:flex-end;margin:16px 0 6px"><div class="grow"><div class="muted small">全体（2114枚）</div><div class="big">${Math.round((RANGE.mc / 2114) * 1000) / 10}%<span class="muted" style="font-size:0.9375rem;font-weight:400"> 習得</span></div></div><div class="muted small" style="text-align:right">習得 ${RANGE.mc} · 学習中 ${RANGE.lc}</div></div>${bar(4, 2)}`;

// 折れ線（SVG）。lines: [{ values, color, dash }]
function lineChart(lines, { h = 120, min = 40, max = 100, labels = true, threshold } = {}) {
  const w = 326, n = lines[0].values.length;
  const x = (i) => 8 + (i * (w - 16)) / (n - 1), y = (v) => 8 + ((max - v) * (h - 16)) / (max - min);
  const grid = [100, 80, 60].filter((v) => v >= min).map((v) => `<line x1="0" x2="${w}" y1="${y(v)}" y2="${y(v)}" stroke="var(--sep)" stroke-width="1"/><text x="${w}" y="${y(v) + 12}" text-anchor="end" font-size="11" fill="var(--fg2)">${v}%</text>`).join('');
  const th = threshold ? `<line x1="0" x2="${w}" y1="${y(threshold)}" y2="${y(threshold)}" stroke="var(--fg2)" stroke-dasharray="3 3" stroke-width="1"/><text x="2" y="${y(threshold) + 13}" font-size="11" fill="var(--fg2)">忘れかけ</text>` : '';
  const paths = lines.map((l) => `<polyline fill="none" stroke="${l.color}" stroke-width="2.5" stroke-linejoin="round" ${l.dash ? 'stroke-dasharray="5 4"' : ''} points="${l.values.map((v, i) => `${x(i)},${y(v)}`).join(' ')}"/><circle cx="${x(0)}" cy="${y(l.values[0])}" r="4" fill="${l.color}"/>`).join('');
  const xl = labels ? `<div class="row tiny muted" style="justify-content:space-between;margin-top:2px"><span>今日</span><span>3日後</span><span>7日後</span></div>` : '';
  return `<svg width="100%" viewBox="0 0 ${w} ${h}" role="img" aria-label="記憶の予測">${grid}${th}${paths}</svg>${xl}`;
}

const CURVES = {
  1: {
    name: '案1 記憶の予測（1本の線）',
    points: ['学習した単語を、このまま復習しなかったら記憶がどう減っていくかの予測を 1 本の線で。', '「忘れかけ」の線を下回る日と、いま復習どきの枚数を一言で。'],
    block: () => `<div class="card"><div class="row"><span class="grow" style="font-weight:600">記憶の予測</span><span class="small muted">学習した 107 枚</span></div>
      <div style="margin-top:8px">${lineChart([{ values: RECALL, color: 'var(--accent)' }], { threshold: 60 })}</div>
      <div class="small" style="margin-top:8px">このままだと <b>4日後</b> に「忘れかけ」に。いま復習どき <b class="acc">12枚</b></div></div>`,
  },
  2: {
    name: '案2 復習した場合としない場合',
    points: ['「今日復習した場合」（実線）と「しなかった場合」（点線）の 2 本。', '今日やると下がり方がゆるやかになるのが見えるので、復習する理由になる。'],
    block: () => `<div class="card"><div style="font-weight:600">今日復習すると</div>
      <div style="margin-top:8px">${lineChart([{ values: RECALL, color: 'var(--fg2)', dash: true }, { values: RECALL_IF_REVIEW, color: 'var(--accent)' }])}</div>
      <div class="row small" style="margin-top:8px;gap:16px"><span><span class="acc">━</span> 復習した場合 80%</span><span class="muted">┅ しない場合 51%</span><span class="muted">（7日後）</span></div></div>`,
  },
  3: {
    name: '案3 日ごとの「忘れかけ」の枚数（棒）',
    points: ['今日から 7 日間、それぞれの日に「忘れかけ」になる単語の枚数を棒で（Anki の予定表と同じ考え方）。', '今日の棒だけ色付き。「今日の復習 12枚」がそのまま学習の目標になる。'],
    block: () => { const mx = Math.max(...DUE); return `<div class="card"><div class="row"><span class="grow" style="font-weight:600">復習の予定</span><span class="small">今日 <b class="acc">${DUE[0]}枚</b></span></div>
      <div style="display:flex;gap:6px;align-items:flex-end;height:100px;margin-top:12px">${DUE.map((v, i) => `<div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%"><span class="tiny ${i ? 'muted' : 'acc'}">${v}</span><div style="width:100%;height:${(v / mx) * 72}px;border-radius:4px;background:${i ? 'var(--fill)' : 'var(--accent)'}"></div></div>`).join('')}</div>
      <div style="display:flex;gap:6px;margin-top:4px">${DAYS.map((d, i) => `<span class="tiny muted" style="flex:1;text-align:center">${i === 0 ? '今日' : i === 1 ? '明日' : i}</span>`).join('')}</div></div>`; },
  },
  4: {
    name: '案4 記憶の状態の内訳',
    points: ['学習した単語を「しっかり／あやうい／忘れかけ」の 3 つに分けた 1 本の帯と枚数。', 'グラフの読み方を考えなくていい。曲線は出さない分、いちばん素早く分かる。'],
    block: () => { const tot = BUCKETS.reduce((s, b) => s + b[1], 0); const col = ['var(--accent)', 'var(--accent-weak)', 'var(--fill)']; return `<div class="card"><div class="row"><span class="grow" style="font-weight:600">記憶の状態</span><span class="small muted">学習した ${tot} 枚</span></div>
      <div style="display:flex;height:14px;border-radius:7px;overflow:hidden;margin:12px 0 10px">${BUCKETS.map((b, i) => `<div style="width:${(b[1] / tot) * 100}%;background:${col[i]}"></div>`).join('')}</div>
      <div class="row" style="justify-content:space-between">${BUCKETS.map((b, i) => `<div><div class="small muted">${b[0]}</div><div style="font-weight:700;font-size:1.25rem" class="${i === 2 ? 'acc' : ''}">${b[1]}<span class="small muted" style="font-weight:400">枚</span></div></div>`).join('')}</div></div>`; },
  },
  5: {
    name: '案5 忘却曲線と単語の位置',
    points: ['教科書どおりの忘却曲線（エビングハウス）の上に、自分の単語がいまどこにいるかを点で並べる。', '右下の点ほど忘れかけ。見た目は「忘却曲線」らしいが、数字で読むのは難しい。'],
    block: () => { const w = 326, h = 120; const pts = Array.from({ length: 60 }, (_, i) => { const t = (i * 37) % 100 / 100; const v = Math.exp(-t * 1.6); return [8 + t * (w - 16), 8 + (1 - v) * (h - 24) + ((i * 13) % 7) - 3]; });
      const curve = Array.from({ length: 50 }, (_, i) => { const t = i / 49; return `${8 + t * (w - 16)},${8 + (1 - Math.exp(-t * 1.6)) * (h - 24)}`; }).join(' ');
      return `<div class="card"><div class="row"><span class="grow" style="font-weight:600">忘却曲線</span><span class="small muted">● が自分の単語</span></div>
      <svg width="100%" viewBox="0 0 ${w} ${h}" style="margin-top:8px" role="img" aria-label="忘却曲線"><polyline fill="none" stroke="var(--fg2)" stroke-width="2" points="${curve}"/>${pts.map(([x, y]) => `<circle cx="${x}" cy="${y}" r="3.5" fill="var(--accent)" opacity="${x > w * 0.6 ? 1 : 0.45}"/>`).join('')}</svg>
      <div class="row tiny muted" style="justify-content:space-between"><span>覚えた直後</span><span>時間がたつ →</span></div>
      <div class="small" style="margin-top:6px">右下の <b class="acc">12枚</b> が忘れかけ</div></div>`; },
  },
};

// ---- 画面 ----
const home = (opt) => screen(`<div class="scroll pad"><div class="row" style="min-height:52px"><span class="grow" style="font-size:1.375rem;font-weight:700">韓国語カード</span><span class="muted">⚙</span></div>
  ${streakCard()}<div style="margin-top:12px">${CURVES[opt].block()}</div>${progressLine()}<div style="height:12px"></div></div>
  <div class="pad" style="padding-top:12px"><button class="btn primary">学習する</button><div class="modes">${['単語カード', 'テスト', 'スペル', 'マッチ'].map((m) => `<button class="btn">${m}</button>`).join('')}</div></div>`);

const ring = (pct, sel, size = 48) => { const r = (size - 6) / 2, c = 2 * Math.PI * r; return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" aria-hidden="true"><circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="${sel ? 'var(--sel-bg)' : 'none'}" stroke="var(--fill)" stroke-width="4"/>${pct ? `<circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="${sel ? 'var(--sel-fg)' : 'var(--accent)'}" stroke-width="4" stroke-linecap="round" stroke-dasharray="${(c * pct) / 100} ${c}" transform="rotate(-90 ${size / 2} ${size / 2})"/>` : ''}</svg>`; };
const rings = () => `<div style="display:grid;grid-template-columns:repeat(6,1fr);row-gap:10px;justify-items:center">${LESSONS.map(([n, t, m]) => `<div style="position:relative;width:52px;display:flex;flex-direction:column;align-items:center">${ring(m, SEL.has(n))}<span style="position:absolute;top:0;height:48px;display:flex;align-items:center;font-size:0.9375rem;font-weight:600;${SEL.has(n) ? 'color:var(--sel-fg)' : ''}">${short(n)}</span><span class="muted tiny">${m}%</span></div>`).join('')}</div>`;

const startPage = (withSheet) => screen(`<div class="pad row" style="min-height:52px"><span class="acc" style="min-width:64px;white-space:nowrap">‹ 戻る</span><span class="grow" style="text-align:center;font-weight:700">学習する</span><span style="min-width:64px"></span></div>
  <div class="scroll pad">
    <div class="card"><div class="small muted">続きから</div><div class="row" style="margin-top:2px"><div class="grow"><div style="font-weight:700">第1〜5課</div><div class="small muted">ラウンドの 3/7 問目 · 昨日 21:40</div></div></div>
      <button class="btn primary" style="margin-top:10px">続きから</button></div>
    <div style="font-weight:700;margin:20px 0 4px">新しく始める</div>
    <div class="row" style="margin-bottom:8px"><span class="muted small grow">課（タップで入れる・外す）</span><span class="small acc">範囲指定　全部</span></div>
    ${rings()}
    <div class="segbtn" style="margin:16px 0 0"><span class="on">単語</span><span class="on">文法</span><span class="on">会話表現</span></div>
    <div class="row small" style="margin:12px 0"><span class="grow">第1〜5課 · 単語・文法・会話表現</span><span class="muted">140枚</span></div>
    <div style="height:8px"></div></div>
  <div class="pad" style="padding-top:12px"><button class="btn" style="width:100%;min-height:56px;font-weight:600">この範囲で新しく始める</button></div>
  ${withSheet ? `<div class="scrim"></div><div class="sheet" role="dialog" aria-label="確認">
    <div style="font-size:1.125rem;font-weight:700">途中のラウンドを終わりにしますか？</div>
    <p style="margin:8px 0 4px">第1〜5課のラウンド（<b>3/7 問目</b>）の続きは<b style="color:var(--ng)">保存されず、消えます</b>。</p>
    <p class="small muted" style="margin:0 0 16px">これまでに答えた単語の「習得・学習中」と間違い回数は残ります。</p>
    <button class="btn danger">途中のラウンドを消して始める</button>
    <button class="btn" style="width:100%;margin-top:8px;min-height:52px">やめる（続きを残す）</button><div style="height:12px"></div></div>` : ''}`);

let cur = 1, pal = 1, theme = 'light';
function render() {
  const c = CURVES[cur];
  document.getElementById('desc').innerHTML = `<h2>${c.name}</h2><ul>${c.points.map((x) => `<li>${x}</li>`).join('')}<li>2・3 枚目は全案共通の「学習する」ページと、途中のラウンドがあるのに新しく始めようとしたときの確認。</li></ul><div class="small" style="color:#55565A">課ごとの枚数は実データ、それ以外の数字はダミー。影は確認シート（画面より手前に浮いている）だけ。アクセント 1 色。</div>`;
  document.getElementById('stage').innerHTML = [['表紙（ホーム）', home(cur)], ['「学習する」を押した先', startPage(false)], ['新しく始めるときの確認', startPage(true)]].map(([t, h]) => `<section><p class="cap">${t}</p>${h}</section>`).join('');
  document.querySelectorAll('#stage .screen').forEach((el) => { for (const [k, v] of Object.entries(PAL[pal][theme])) el.style.setProperty('--' + k, v); });
  document.querySelectorAll('[data-opt]').forEach((b) => b.setAttribute('aria-pressed', String(Number(b.dataset.opt) === cur)));
  document.querySelectorAll('[data-pal]').forEach((b) => b.setAttribute('aria-pressed', String(Number(b.dataset.pal) === pal)));
  document.querySelectorAll('[data-theme]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.theme === theme)));
}
document.querySelectorAll('[data-opt]').forEach((b) => b.addEventListener('click', () => { cur = Number(b.dataset.opt); render(); }));
document.querySelectorAll('[data-pal]').forEach((b) => b.addEventListener('click', () => { pal = Number(b.dataset.pal); render(); }));
document.querySelectorAll('[data-theme]').forEach((b) => b.addEventListener('click', () => { theme = b.dataset.theme; render(); }));
render();
</script>
</body>
</html>
