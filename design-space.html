<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>宇宙デザイン案</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet">
<style>
  /* ---- 見比べ用ページ ---- */
  html { font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif; }
  body { margin: 0; background: #E4E3E0; color: #1B1C1E; }
  .tools { position: sticky; top: 0; z-index: 10; background: #E4E3E0; padding: 12px 16px; display: flex; flex-wrap: wrap; gap: 8px; }
  .tools button { font: inherit; font-size: 0.9375rem; min-height: 44px; min-width: 44px; padding: 0 14px; border: 0; border-radius: 10px; background: #D3D2CE; cursor: pointer; }
  .tools button[aria-pressed="true"] { background: #1B1C1E; color: #fff; }
  .desc { max-width: 1100px; padding: 0 16px 8px; font-size: 0.9375rem; line-height: 1.6; }
  .desc h2 { font-size: 1.125rem; margin: 4px 0; }
  .desc ul { margin: 4px 0; padding-left: 1.2em; }
  .stage { display: flex; flex-wrap: wrap; gap: 24px; padding: 8px 16px 48px; align-items: flex-start; }
  .cap { font-size: 0.8125rem; color: #55565A; margin: 0 0 6px 4px; }
  .legend { display: flex; flex-wrap: wrap; gap: 16px; padding: 0 16px 16px; align-items: flex-end; }
  .legend figure { margin: 0; text-align: center; font-size: 0.75rem; color: #55565A; }

  /* ---- アプリ画面（暗い単色の背景・アクセントは黄 1 色） ---- */
  .screen {
    --bg: #0E1020; --fg: #ECEAF4; --fg2: #9A98AE; --sep: #23263A; --fill: #1A1D31; --fill-press: #23263E;
    --accent: #F2C94C; --accent-weak: rgba(242, 201, 76, 0.35); --on-accent: #1A1406;
    --ok: #6FD39A; --ok-bg: #16301F; --star: rgba(255, 255, 255, 0.22);
    position: relative; width: 390px; max-width: 100%; height: 844px; overflow: hidden; border-radius: 36px;
    background: var(--bg); color: var(--fg); display: flex; flex-direction: column; font-size: 1.0625rem; line-height: 1.5;
  }
  .status { height: 47px; flex: none; display: flex; align-items: flex-end; justify-content: space-between; padding: 0 28px 6px; font-size: 0.9375rem; font-weight: 600; }
  .homebar { height: 34px; flex: none; display: flex; align-items: flex-end; justify-content: center; padding-bottom: 8px; }
  .homebar::after { content: ""; width: 134px; height: 5px; border-radius: 3px; background: var(--fg); opacity: .9; }
  .pad { padding: 0 16px; position: relative; z-index: 1; }
  .scroll { flex: 1; overflow: auto; position: relative; z-index: 1; }
  .dot { font-family: "DotGothic16", -apple-system, sans-serif; letter-spacing: 0.02em; }
  .ko { font-family: "Gowun Batang", "Apple SD Gothic Neo", serif; }
  .muted { color: var(--fg2); }
  .small { font-size: 0.8125rem; }
  .row { display: flex; align-items: center; gap: 12px; }
  .grow { flex: 1; min-width: 0; }
  .btn { font: inherit; border: 0; min-height: 48px; border-radius: 12px; background: var(--fill); color: var(--fg); padding: 0 12px; }
  .btn.primary { background: var(--accent); color: var(--on-accent); font-weight: 700; min-height: 56px; width: 100%; }
  .btn.text { background: none; color: var(--accent); }
  .modes { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 8px; }
  .modes .btn { font-size: 0.875rem; padding: 0 4px; }
  .bar { height: 6px; border-radius: 0; background: var(--fill); display: flex; overflow: hidden; }
  .bar > .m { background: var(--accent); } .bar > .l { background: var(--accent-weak); }
  .list > * { border-bottom: 1px solid var(--sep); } .list > *:last-child { border-bottom: 0; }
  .lrow { display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 6px 0; }
  canvas.planet { image-rendering: pixelated; image-rendering: crisp-edges; display: block; }
  .stars { position: absolute; inset: 0; pointer-events: none; z-index: 0; }
  .tile { background: var(--fill); border-radius: 10px; padding: 6px; display: flex; flex-direction: column; align-items: center; gap: 2px; min-height: 64px; justify-content: center; }
  .tile.sel { background: var(--accent); color: var(--on-accent); }
  .tile.sel .muted { color: var(--on-accent); opacity: .75; }
  .num { font-family: "DotGothic16", -apple-system, sans-serif; font-size: 1.75rem; line-height: 1.1; }
  .heat { display: grid; grid-template-rows: repeat(7, 10px); grid-auto-flow: column; grid-auto-columns: 10px; gap: 3px; }
  .heat i { background: var(--fill); }
  .heat i.l1 { background: rgba(242, 201, 76, 0.3); } .heat i.l2 { background: rgba(242, 201, 76, 0.6); } .heat i.l3 { background: var(--accent); }
  .pager { display: flex; justify-content: center; gap: 6px; }
  .pager i { width: 6px; height: 6px; background: var(--fill-press); } .pager i.on { background: var(--accent); }

  /* ウィジェットの見本（iPhone のウィジェットの大きさ） */
  .widgets { display: flex; flex-direction: column; gap: 16px; padding: 24px; background: #3B4A63; border-radius: 36px; width: 390px; max-width: 100%; box-sizing: border-box; }
  .w { background: #0E1020; color: #ECEAF4; border-radius: 22px; overflow: hidden; position: relative; }
  .w.s { width: 158px; height: 158px; } .w.m { width: 338px; height: 158px; }
  .lock { color: #fff; display: flex; gap: 12px; }
  .lock .acc { width: 72px; height: 72px; border-radius: 50%; background: rgba(255,255,255,.18); display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 12px; }
  .lock .rect { height: 72px; width: 160px; border-radius: 14px; background: rgba(255,255,255,.18); display: flex; align-items: center; gap: 8px; padding: 0 10px; font-size: 12px; box-sizing: border-box; }
</style>
</head>
<body>
<div class="tools" role="toolbar">
  <button data-opt="1">案1</button><button data-opt="2">案2</button><button data-opt="3">案3</button><button data-opt="4">案4</button><button data-opt="5">案5</button>
</div>
<div class="desc" id="desc"></div>
<div class="legend" id="legend"></div>
<div class="stage" id="stage"></div>

<script>
// ---- 実データ（課ごとの枚数は実数、習得率はダミー） ----
const LESSONS = [
  ['第1課', 9, 100, 0], ['第2課', 26, 88, 8], ['第3課', 19, 74, 16], ['第4課', 35, 51, 23], ['第5課', 51, 22, 30],
  ['第6課', 87, 6, 14], ['第7課', 107, 0, 4], ['第8課', 100, 0, 0], ['第9課', 153, 0, 0], ['第10課', 165, 0, 0],
  ['第11課', 123, 0, 0], ['第12課', 121, 0, 0], ['第13課', 96, 0, 0], ['第14課', 105, 0, 0], ['第15課', 121, 0, 0],
  ['第16課', 115, 0, 0], ['第17課', 102, 0, 0], ['第18課', 114, 0, 0], ['第19課', 95, 0, 0], ['第20課', 85, 0, 0],
  ['第21課', 126, 0, 0], ['第22課', 77, 0, 0], ['会話表現', 82, 10, 5],
];
const SELECTED = new Set(['第1課', '第2課', '第3課', '第4課', '第5課']);
const ROUND = [['기다리다', '待つ', '習得'], ['자주', 'よく、頻繁に', '習得'], ['자리', '席', '学習中'], ['미래', '未来', '要復習'], ['가구', '家具', '学習中'], ['여기', 'ここ', '習得'], ['고기', '肉', '学習中']];

// ---- 習得率 → 惑星の段階 ----
const STAGES = ['ちり', '岩の星', 'マグマの星', '海のある星', '緑と雲の星', '環のある星（完成）'];
function stageOf(mastered, learning) {
  if (mastered >= 100) return 5;
  if (mastered >= 75) return 4;
  if (mastered >= 50) return 3;
  if (mastered >= 25) return 2;
  return mastered > 0 || learning > 0 ? 1 : 0;
}

// ---- ドット絵の惑星（課ごとに模様は固定、段階で育つ） ----
function rng(seed) { let a = seed >>> 0; return () => { a = (a + 0x6d2b79f5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
function noise(seed, n = 9) {
  const r = rng(seed); const g = Array.from({ length: n * n }, () => r());
  const v = (i, j) => g[((j % n) + n) % n * n + ((i % n) + n) % n];
  const s = (t) => t * t * (3 - 2 * t);
  return (x, y) => { const xi = Math.floor(x), yi = Math.floor(y), xf = s(x - xi), yf = s(y - yi);
    const a = v(xi, yi), b = v(xi + 1, yi), c = v(xi, yi + 1), d = v(xi + 1, yi + 1);
    return a + (b - a) * xf + (c - a) * yf + (a - b - c + d) * xf * yf; };
}
const PAL = {
  dust: ['#2A2C3A', '#3D4052', '#55596E', '#6E7389'],
  rock: ['#3A2A24', '#5A4034', '#7D5A45', '#A07A5C'],
  dark: ['#24181A', '#3A2426', '#4E3032', '#643E3E'],
  magma: ['#B8361E', '#E8642A', '#F7A53A', '#FFE07A'],
  sea: ['#14305E', '#1D4A86', '#2A68AE', '#4A8ED0'],
  land: ['#4B3A26', '#6E5534', '#93743F', '#B8955A'],
  green: ['#1E4A2E', '#2E6B3C', '#459150', '#6DB868'],
  cloud: ['#9AA6BC', '#C4CCDA', '#E6EAF2', '#FFFFFF'],
  ring: ['#7A6A4A', '#A8915F', '#D6BD7E', '#F2DCA0'],
};
const BAYER = [[0, 0.5], [0.75, 0.25]];
function drawPlanet(canvas, seed, stage, px = 32) {
  canvas.width = canvas.height = px;
  const ctx = canvas.getContext('2d');
  const img = ctx.createImageData(px, px);
  const c = px / 2, R = px * (stage === 5 ? 0.27 : 0.36) * (stage === 0 ? 0.75 : 1);
  const n1 = noise(seed), n2 = noise(seed * 7 + 13);
  const set = (x, y, hex) => { const i = (y * px + x) * 4; img.data[i] = parseInt(hex.slice(1, 3), 16); img.data[i + 1] = parseInt(hex.slice(3, 5), 16); img.data[i + 2] = parseInt(hex.slice(5, 7), 16); img.data[i + 3] = 255; };
  const ring = (x, y) => { const rx = (x + 0.5 - c) / (R * 1.8), ry = (y + 0.5 - c) / (R * 0.55); const d = rx * rx + ry * ry; return d > 0.62 && d < 1.0; };
  for (let y = 0; y < px; y++) for (let x = 0; x < px; x++) {
    const dx = (x + 0.5 - c) / R, dy = (y + 0.5 - c) / R, d2 = dx * dx + dy * dy;
    const inPlanet = d2 <= 1;
    if (stage === 5 && ring(x, y) && (!inPlanet || y + 0.5 > c)) {
      const sh = Math.min(3, Math.max(0, Math.floor(((x + 0.5) / px) * 3 + BAYER[y % 2][x % 2])));
      set(x, y, PAL.ring[3 - sh]); continue;
    }
    if (!inPlanet) continue;
    const nz = Math.sqrt(1 - d2);
    const light = -0.55 * dx - 0.55 * dy + 0.65 * nz; // 左上から光
    const shade = Math.max(0, Math.min(3, Math.floor((light + 0.35) * 3 + BAYER[y % 2][x % 2])));
    const h = n1((dx + 1) * 3.2 + seed % 5, (dy + 1) * 3.2) * 0.7 + n2((dx + 1) * 6.5, (dy + 1) * 6.5) * 0.3;
    const h2 = n2((dx + 1) * 5 + 3, (dy + 1) * 4);
    let pal = PAL.dust;
    if (stage === 1) pal = h2 > 0.72 ? PAL.dark : PAL.rock;
    else if (stage === 2) pal = Math.abs(h - 0.5) < 0.06 ? PAL.magma : PAL.dark;
    else if (stage === 3) pal = h < 0.52 ? PAL.sea : PAL.land;
    else if (stage >= 4) pal = h2 > 0.7 ? PAL.cloud : h < 0.48 ? PAL.sea : PAL.green;
    set(x, y, pal[pal === PAL.magma ? 3 - Math.min(3, Math.floor(Math.abs(h - 0.5) * 50)) : shade]);
  }
  if (stage === 5) { // 小さな月
    const mx = Math.round(px * 0.84), my = Math.round(px * 0.18);
    for (let y = -1; y <= 1; y++) for (let x = -1; x <= 1; x++) if (x * x + y * y <= 1) set(mx + x, my + y, x + y < 0 ? '#D8DCE6' : '#8E94A6');
  }
  ctx.putImageData(img, 0, 0);
}
const seedOf = (name) => [...name].reduce((a, ch) => (a * 31 + ch.charCodeAt(0)) >>> 0, 7) % 1000 + 1;
let pid = 0;
const planetHTML = (name, stage, size, px = 32) => { const id = 'p' + pid++; queue.push([id, seedOf(name), stage, px]); return `<canvas class="planet" id="${id}" style="width:${size}px;height:${size}px" aria-label="${STAGES[stage]}"></canvas>`; };
let queue = [];
const flush = () => { for (const [id, s, st, px] of queue) { const el = document.getElementById(id); if (el) drawPlanet(el, s, st, px); } queue = []; };

// 背景の星（位置は番号で固定、薄く、タップは拾わない）
const starsHTML = (n = 40, seed = 3) => { const r = rng(seed); let s = ''; for (let i = 0; i < n; i++) { const x = Math.floor(r() * 390), y = Math.floor(r() * 844), sz = r() < 0.15 ? 2 : 1; s += `<i style="position:absolute;left:${x}px;top:${y}px;width:${sz}px;height:${sz}px;background:var(--star)"></i>`; } return `<div class="stars" aria-hidden="true">${s}</div>`; };

const status = () => '<div class="status" style="position:relative;z-index:1"><span>9:41</span><span>●●● ▮</span></div>';
const homebar = () => '<div class="homebar" style="position:relative;z-index:1"></div>';
const screen = (inner, stars = true) => `<div class="screen">${stars ? starsHTML() : ''}${status()}${inner}${homebar()}</div>`;
const bar = (m, l) => `<div class="bar"><div class="m" style="width:${m}%"></div><div class="l" style="width:${l}%"></div></div>`;
const modes = () => `<div class="modes">${['単語カード', 'テスト', 'スペル', 'マッチ'].map((m) => `<button class="btn">${m}</button>`).join('')}</div>`;
const RANGE = { label: '第1〜5課', count: 140, m: 54, l: 22, mc: 76, lc: 31, uc: 33 };
const rangeStage = stageOf(RANGE.m, RANGE.l);
const stats = () => `<div class="row" style="gap:24px"><div><div class="num" style="color:var(--accent)">${RANGE.mc}</div><span class="muted small">習得</span></div><div><div class="num">${RANGE.lc}</div><span class="muted small">学習中</span></div><div><div class="num">${RANGE.uc}</div><span class="muted small">未学習</span></div></div>`;
const roundList = () => `<div class="list">${ROUND.map(([k, j, s]) => `<div class="lrow"><div class="grow"><div class="ko">${k}</div><div class="muted small">${j}</div></div><span class="small" style="${s === '習得' ? 'color:var(--accent)' : s === '要復習' ? 'font-weight:700' : 'color:var(--fg2)'}">${s}</span></div>`).join('')}</div>`;
const heat = (weeks = 14) => { const r = rng(42); let s = ''; for (let i = 0; i < weeks * 7; i++) { const v = i > weeks * 7 - 30 ? r() : r() * 0.5; s += `<i class="${v > 0.8 ? 'l3' : v > 0.55 ? 'l2' : v > 0.35 ? 'l1' : ''}"></i>`; } return `<div class="heat">${s}</div>`; };

// ---- 案 ----
const OPTIONS = {
  1: {
    name: '案1 惑星ホーム（いまの案2に、範囲の惑星を1つ足す）',
    points: ['選んでいる範囲（第1〜5課）全体の習得率で、1つの惑星が育つ。', '課のタイルにも小さな惑星。それ以外の配置は今と同じなので、使い勝手は変わらない。', 'ラウンド完了で、惑星が育った瞬間だけ見せる（状態が変わったことを伝える動き）。'],
    home: () => screen(`<div class="scroll pad">
      <div class="row" style="min-height:52px"><span class="dot grow" style="font-size:1.375rem">韓国語カード</span><span class="muted">⚙</span></div>
      <div style="display:flex;flex-direction:column;align-items:center;margin:4px 0 8px">${planetHTML('range', rangeStage, 150)}<div class="dot small muted" style="margin-top:6px">${RANGE.label}の星 · ${STAGES[rangeStage]}</div></div>
      ${stats()}<div style="margin:12px 0 16px">${bar(RANGE.m, RANGE.l)}</div>
      <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px">${LESSONS.map(([n, t, m, l]) => `<div class="tile ${SELECTED.has(n) ? 'sel' : ''}">${planetHTML(n, stageOf(m, l), 28, 16)}<span class="small">${n === '会話表現' ? '会話' : n.replace('第', '')}</span><span class="muted small dot">${m}%</span></div>`).join('')}</div><div style="height:12px"></div>
    </div><div class="pad" style="padding-top:12px"><button class="btn primary">学習 · ${RANGE.count}枚</button>${modes()}</div>`),
    done: () => screen(`<div class="pad"><div class="dot" style="font-size:1.375rem;min-height:52px;display:flex;align-items:center">ラウンド完了</div>
      <div class="row" style="justify-content:center;gap:16px;margin:8px 0">${planetHTML('range', 2, 88)}<span class="dot muted">→</span>${planetHTML('range', 3, 110)}</div>
      <div class="dot" style="text-align:center;color:var(--accent)">海ができた！（習得 54%）</div></div>
      <div class="scroll pad" style="margin-top:8px">${roundList()}</div><div class="pad" style="padding-top:12px"><button class="btn primary">次のラウンドへ</button></div>`),
  },
  2: {
    name: '案2 星系マップ（課のタイルを惑星の並びに置きかえる）',
    points: ['23課が1つの星系。課ごとの習得率でそれぞれの惑星が育つ。全部「環のある星」になればコンプリート。', '惑星をタップで範囲に入れる・外す（選択中は下の名前が黄色）。', '並びは課の順で固定。データが変わっても位置は動かない。'],
    home: () => screen(`<div class="pad">
      <div class="row" style="min-height:52px"><span class="dot grow" style="font-size:1.375rem">韓国語星系</span><span class="muted">⚙</span></div>
      <div class="row small muted" style="gap:16px"><span>完成 <b class="dot" style="color:var(--accent)">1</b>/23</span><span>習得 ${RANGE.mc}</span><span>学習中 ${RANGE.lc}</span></div></div>
      <div class="scroll pad" style="margin-top:8px"><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:14px 4px">${LESSONS.map(([n, t, m, l], i) => `<div style="display:flex;flex-direction:column;align-items:center;${i % 2 ? 'margin-top:14px' : ''}">${planetHTML(n, stageOf(m, l), 64, 32)}<span class="small" style="${SELECTED.has(n) ? 'color:var(--accent);font-weight:700' : ''}">${n === '会話表現' ? '会話' : n.replace('第', '')}</span><span class="muted small dot">${m}%</span></div>`).join('')}</div></div>
      <div class="pad" style="padding-top:12px"><button class="btn primary">学習 · ${RANGE.label} ${RANGE.count}枚</button>${modes()}</div>`),
    done: () => screen(`<div class="pad"><div class="dot" style="font-size:1.375rem;min-height:52px;display:flex;align-items:center">ラウンド完了</div>
      <div style="display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:4px 0 8px">${LESSONS.slice(0, 5).map(([n, t, m, l], i) => `<div style="display:flex;flex-direction:column;align-items:center">${planetHTML(n, i === 3 ? 3 : stageOf(m, l), 56, 32)}<span class="small ${i === 3 ? '' : 'muted'}" style="${i === 3 ? 'color:var(--accent)' : ''}">${n.replace('第', '')}</span></div>`).join('')}</div>
      <div class="dot small" style="text-align:center;color:var(--accent)">4課の星に海ができた</div></div>
      <div class="scroll pad" style="margin-top:8px">${roundList()}</div><div class="pad" style="padding-top:12px"><button class="btn primary">次のラウンドへ</button></div>`),
  },
  3: {
    name: '案3 1課ずつ（左右にスワイプして課の惑星を見る）',
    points: ['異星フォーカスの「プロジェクト＝惑星をスワイプ」に一番近い。1画面1課で、大きな惑星と数字だけ。', '出題範囲は「今見ている課」。複数の課をまとめるときは範囲ボタンから。', '中身が変わるのはスワイプしたときだけ（自動で回さない）。'],
    home: () => screen(`<div class="pad"><div class="row" style="min-height:52px"><span class="muted small grow">韓国語カード</span><span class="muted">⚙</span></div></div>
      <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;z-index:1">
        <div class="dot" style="font-size:1.5rem">第4課</div><div class="muted small">35枚 · ${STAGES[3]}</div>
        <div style="margin:16px 0">${planetHTML('第4課', 3, 240)}</div>
        <div class="pager">${LESSONS.map((_, i) => `<i class="${i === 3 ? 'on' : ''}"></i>`).join('')}</div>
      </div>
      <div class="pad"><div class="row" style="justify-content:space-around;margin-bottom:12px"><div style="text-align:center"><div class="num" style="color:var(--accent)">18</div><span class="muted small">習得</span></div><div style="text-align:center"><div class="num">8</div><span class="muted small">学習中</span></div><div style="text-align:center"><div class="num">9</div><span class="muted small">未学習</span></div></div>
      <button class="btn primary">この課を学習</button><div class="row" style="margin-top:8px"><button class="btn" style="flex:1">範囲を選ぶ</button><button class="btn" style="flex:2">ほかのモード</button></div></div>`),
    done: () => OPTIONS[1].done(),
  },
  4: {
    name: '案4 控えめ（今の画面のまま、色と数字の書体と小さな惑星だけ）',
    points: ['配置は今の案2そのまま。夜空の色・ドット書体の数字・統計の横の小さな惑星だけ足す。', '一番変化が小さく、CLAUDE.md の方針にもいちばん素直。', 'その代わり「育てている感じ」は弱い。'],
    home: () => screen(`<div class="scroll pad">
      <div class="row" style="min-height:52px"><span class="dot grow" style="font-size:1.375rem">韓国語カード</span><span class="muted">⚙</span></div>
      <div class="muted small">${RANGE.label} · ${RANGE.count}枚</div>
      <div class="row" style="margin:8px 0 12px">${stats()}<span class="grow"></span>${planetHTML('range', rangeStage, 64)}</div>
      ${bar(RANGE.m, RANGE.l)}
      <div class="muted small" style="margin:20px 0 8px">課（タップで範囲に入れる・外す）</div>
      <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px">${LESSONS.map(([n, t, m]) => `<div class="tile ${SELECTED.has(n) ? 'sel' : ''}" style="align-items:flex-start"><span>${n === '会話表現' ? '会話' : n.replace('第', '')}</span><span class="muted small dot">${m}%</span></div>`).join('')}</div><div style="height:12px"></div>
    </div><div class="pad" style="padding-top:12px"><button class="btn primary">学習 · ${RANGE.count}枚</button>${modes()}</div>`),
    done: () => screen(`<div class="pad"><div class="row" style="min-height:52px"><span class="dot grow" style="font-size:1.375rem">ラウンド完了</span>${planetHTML('range', 3, 48)}</div></div>
      <div class="scroll pad">${roundList()}<div class="muted small" style="margin:16px 0 6px">範囲全体の進捗</div>${bar(RANGE.m, RANGE.l)}</div><div class="pad" style="padding-top:12px"><button class="btn primary">次のラウンドへ</button></div>`, false),
  },
  5: {
    name: '案5 観測ログ（惑星＋毎日の記録）',
    points: ['惑星の下に、ここ14週の学習日をドットで並べる（異星フォーカスの統計のヒートマップ）。連続日数も出す。', '続けている実感が出る。課の一覧は「範囲」ボタンの先に移す。', '学習した日を記録する仕組みを新しく足す必要がある（同期にも乗る）。'],
    home: () => screen(`<div class="pad"><div class="row" style="min-height:52px"><span class="dot grow" style="font-size:1.375rem">観測ログ</span><span class="small" style="color:var(--accent)">範囲</span><span class="muted">⚙</span></div></div>
      <div class="pad" style="display:flex;flex-direction:column;align-items:center">${planetHTML('range', rangeStage, 170)}<div class="dot small muted" style="margin-top:6px">${RANGE.label}の星 · ${STAGES[rangeStage]}</div></div>
      <div class="pad" style="margin-top:16px"><div class="row" style="gap:24px;margin-bottom:12px"><div><div class="num" style="color:var(--accent)">12<span style="font-size:1rem">日</span></div><span class="muted small">連続</span></div><div><div class="num">21</div><span class="muted small">今日の回答</span></div><div><div class="num">${RANGE.m}<span style="font-size:1rem">%</span></div><span class="muted small">習得</span></div></div>
      ${heat()}<div class="muted small" style="margin-top:6px">14週間の学習日</div></div>
      <div style="flex:1"></div>
      <div class="pad"><button class="btn primary">学習 · ${RANGE.count}枚</button>${modes()}</div>`),
    done: () => screen(`<div class="pad"><div class="dot" style="font-size:1.375rem;min-height:52px;display:flex;align-items:center">ラウンド完了</div>
      <div class="row" style="gap:16px;margin:4px 0 12px">${planetHTML('range', 3, 72)}<div><div class="dot" style="color:var(--accent)">今日も観測 · 連続 12日</div><div class="muted small">今日の回答 28 · 習得 +3</div></div></div>${heat(14)}</div>
      <div class="scroll pad" style="margin-top:12px">${roundList()}</div><div class="pad" style="padding-top:12px"><button class="btn primary">次のラウンドへ</button></div>`),
  },
};

// ウィジェット（Scriptable で作る想定）と、ロック画面
function widgets(opt) {
  const p = (name, st, size) => planetHTML(name, st, size);
  const small = opt === 2
    ? `<div class="w s" style="padding:12px;box-sizing:border-box;display:grid;grid-template-columns:repeat(4,1fr);gap:2px;align-content:center">${LESSONS.slice(0, 12).map(([n, t, m, l]) => p(n, stageOf(m, l), 30)).join('')}</div>`
    : `<div class="w s" style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px">${p('range', rangeStage, 84)}<div class="dot" style="font-size:20px;color:#F2C94C">${RANGE.m}%</div></div>`;
  const medium = `<div class="w m" style="display:flex;align-items:center;gap:12px;padding:14px;box-sizing:border-box">${p('range', rangeStage, 120)}
    <div style="flex:1"><div class="dot" style="font-size:13px;color:#9A98AE">${RANGE.label}の星</div><div class="dot" style="font-size:28px;color:#F2C94C;line-height:1.2">${RANGE.m}%</div>
    <div style="font-size:12px;color:#9A98AE">学習中 ${RANGE.lc} · 今日 21問</div><div style="font-size:12px;color:#ECEAF4;margin-top:4px">${opt === 5 ? '連続 12日' : 'あと7語で次の段階'}</div></div></div>`;
  const lock = `<div class="lock"><div class="acc"><span class="dot" style="font-size:18px">54%</span><span>習得</span></div><div class="rect"><span class="dot" style="font-size:18px">21</span><span>今日の回答<br>学習中 ${RANGE.lc}</span></div></div>`;
  return `<section><p class="cap">ウィジェット（Scriptable）とロック画面・アイコンのバッジ</p><div class="widgets">${small}${medium}${lock}
    <div class="row" style="gap:10px;color:#fff;font-size:12px"><div style="position:relative;width:60px;height:60px;border-radius:14px;flex:none;background:url(icons/apple-touch-icon.png) center/cover"><span style="position:absolute;top:-6px;right:-6px;background:#FF3B30;color:#fff;border-radius:10px;min-width:20px;height:20px;font-size:12px;display:flex;align-items:center;justify-content:center;padding:0 5px">31</span></div><span>アプリのアイコンに「学習中 31」をバッジで出す（ウィジェットなしで、ホーム画面を見ただけで分かる）</span></div></div></section>`;
}

function render(opt) {
  const o = OPTIONS[opt];
  pid = 0;
  document.getElementById('desc').innerHTML = `<h2>${o.name}</h2><ul>${o.points.map((x) => `<li>${x}</li>`).join('')}</ul><div class="small" style="color:#55565A">課ごとの枚数は実データ、習得率はダミー。背景は暗い単色、アクセントは黄 1 色。数字と見出しはドット書体（DotGothic16）、ハングルは今までどおり Gowun Batang。</div>`;
  document.getElementById('legend').innerHTML = STAGES.map((s, i) => `<figure>${planetHTML('第4課', i, 64)}<figcaption>${i}. ${s}<br>${['0%', '1〜24%', '25〜49%', '50〜74%', '75〜99%', '100%'][i]}</figcaption></figure>`).join('');
  document.getElementById('stage').innerHTML = `<section><p class="cap">ホーム</p>${o.home()}</section><section><p class="cap">ラウンド完了（惑星が育つ）</p>${o.done()}</section>${widgets(opt)}`;
  document.querySelectorAll('[data-opt]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.opt === String(opt))));
  flush();
}
document.querySelectorAll('[data-opt]').forEach((b) => b.addEventListener('click', () => render(Number(b.dataset.opt))));
document.fonts.ready.then(() => render(1));
render(1);
</script>
</body>
